[project]
name = "limodel"
version = "0.1.0"
description = "Find the best electrodialysis setup for Li selectivity over Mg"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
    "typer",
]

[project.scripts]
limodel = "limodel.cli.main:app"

[dependency-groups]
dev = [
    "pytest",
    "jupyter",
    "openpyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
